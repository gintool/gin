// To create fat (uber) jar
plugins {
    id 'com.gradleup.shadow' version '9.2.2' // ← new plugin id
    id 'java'
    id 'application'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = "gin.LocalSearch"
}

repositories {
    mavenCentral()
    maven { url 'https://repo.gradle.org/gradle/libs-releases' }
}

// this looks pretty messy, but it's so we can top up dependencies for
// running junit tests from a variety of junit versions
// while also not clashing with any junit classes included with a given project.
// the dependencies that goes with these are added further below, then they
// are bundled in the showjar task
// ExternalTestRunner then dynamically looks for these and adds them to
// classpath as needed.
configurations {
    junit5Launcher {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    junit5PlatformEngine {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    junit5JupiterEngine {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }

    junit6Launcher {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    junit6PlatformEngine {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    junit6JupiterEngine {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    junit5PlatformCommons {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    junit6PlatformCommons {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    junit5JupiterApi {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    junit6JupiterApi {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }

    junit5OpenTest4j {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    junit6OpenTest4j {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }

    junit5ApiGuardian {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    junit6ApiGuardian {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
}

dependencies {

    implementation group: 'commons-io', name: 'commons-io', version: '2.8.0'
    implementation group: 'com.google.guava', name: 'guava', version: '30.1-jre'
    implementation platform('org.junit:junit-bom:5.11.0')
    //implementation 'org.junit.jupiter:junit-jupiter'
    runtimeOnly 'org.junit.jupiter:junit-jupiter-engine'
    implementation 'org.junit.platform:junit-platform-launcher'
    implementation 'org.junit.platform:junit-platform-engine'
    implementation 'org.junit.vintage:junit-vintage-engine'
    compileOnly 'org.apiguardian:apiguardian-api:1.1.2'
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    //implementation group: 'junit', name: 'junit', version: '4.13.1'
    //implementation group: 'org.hamcrest', name: 'hamcrest', version: '2.2'
    implementation 'junit:junit:4.13.2'
    implementation 'org.hamcrest:hamcrest:2.2'
    implementation group: 'com.github.javaparser', name: 'javaparser-core', version: '3.24.0'
    implementation group: 'org.apache.commons', name: 'commons-math3', version: '3.6.1'
    implementation group: 'org.apache.commons', name: 'commons-rng-simple', version: '1.3'
    implementation group: 'org.apache.commons', name: 'commons-rng-core', version: '1.3'
    implementation group: 'org.apache.commons', name: 'commons-rng-client-api', version: '1.3'
    implementation group: 'org.apache.commons', name: 'commons-rng-sampling', version: '1.3'
    implementation group: 'com.opencsv', name: 'opencsv', version: '5.3'

    // ---- JUnit for tests of Gin ----
    testImplementation platform('org.junit:junit-bom:5.11.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'          // API + parameterized, etc.
    testRuntimeOnly  'org.junit.jupiter:junit-jupiter-engine:5.11.0'
    testRuntimeOnly  'org.junit.platform:junit-platform-launcher:1.11.0'
    testCompileOnly 'org.apiguardian:apiguardian-api:1.1.2'

    // for LLM integrations
    implementation 'dev.langchain4j:langchain4j:0.18.0'

    // LLM: SLF4J API
    //implementation 'org.slf4j:slf4j-api:1.7.32'

    // LLM: Logback Classic (implementation of SLF4J)
    implementation 'ch.qos.logback:logback-classic:1.2.3'

    // LLM: ollama4j
    implementation 'io.github.ollama4j:ollama4j:1.1.6'	

    // https://mvnrepository.com/artifact/com.github.spullara.cli-parser/cli-parser
    implementation group: 'com.github.spullara.cli-parser', name: 'cli-parser', version: '1.1.5'

    // https://mvnrepository.com/artifact/org.tinylog/tinylog
    implementation group: 'org.tinylog', name: 'tinylog', version: '1.3.6'

    // https://mvnrepository.com/artifact/org.ekstazi/org.ekstazi.core
    implementation group: 'org.ekstazi', name: 'org.ekstazi.core', version: '5.3.0'

    // https://mvnrepository.com/artifact/edu.illinois/starts-core
    implementation group: 'edu.illinois', name: 'starts-core', version: '1.3'

    // https://mvnrepository.com/artifact/org.apache.commons/commons-lang3
    implementation group: 'org.apache.commons', name: 'commons-lang3', version: '3.11'

    // Include the jar by "mvn package" on the fork of InMemoryCompiler created for gin.
    // This is a substitute for the following:
    // compile "org.mdkt.compiler:InMemoryJavaCompiler:1.3.0"
    // ... because InMemoryJavaCompiler has yet to incorporate the critical bugfix
    // ... and we then forked a second time to provide access to bytes of compiled code.
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // Used to profile maven projects
    implementation group: 'org.apache.maven.shared', name: 'maven-invoker', version: '3.2.0'

    implementation group: 'org.apache.maven', name: 'maven-core', version: '3.9.0'

    // Used to profile gradle projects
    implementation 'org.gradle:gradle-tooling-api:9.0.0'
    runtimeOnly 'org.slf4j:slf4j-simple:2.0.6'

    // Create jars for call graph generation using zta-zip
    implementation 'org.zeroturnaround:zt-zip:1.14'

    // Parse commandline
    implementation group: 'org.zeroturnaround', name: 'zt-exec', version: '1.12'

    // Parse build reports using jsoup
    implementation 'org.jsoup:jsoup:1.13.1'

    testImplementation "org.mockito:mockito-core:3.+"

    // Embedded JUnit 5 runtime bits
    junit5Launcher       'org.junit.platform:junit-platform-launcher:1.10.1'
    junit5PlatformEngine 'org.junit.platform:junit-platform-engine:1.10.1'
    junit5JupiterEngine  'org.junit.jupiter:junit-jupiter-engine:5.10.1'

    // Embedded JUnit 6 runtime bits
    junit6Launcher       'org.junit.platform:junit-platform-launcher:6.0.2'
    junit6PlatformEngine 'org.junit.platform:junit-platform-engine:6.0.2'
    junit6JupiterEngine  'org.junit.jupiter:junit-jupiter-engine:6.0.2'

    junit5PlatformCommons 'org.junit.platform:junit-platform-commons:1.10.1'
    junit6PlatformCommons 'org.junit.platform:junit-platform-commons:6.0.2'

    junit5JupiterApi  'org.junit.jupiter:junit-jupiter-api:5.10.1'
    junit6JupiterApi  'org.junit.jupiter:junit-jupiter-api:6.0.2'

    junit5OpenTest4j  'org.opentest4j:opentest4j:1.3.0'
    junit6OpenTest4j  'org.opentest4j:opentest4j:1.3.0'

    junit5ApiGuardian 'org.apiguardian:apiguardian-api:1.1.2'
    junit6ApiGuardian 'org.apiguardian:apiguardian-api:1.1.2'
}

jar {
    manifest {
        attributes(
                'Class-Path': configurations.compileClasspath.collect { it.getName() }.join(' '),
                'Premain-Class': "org.ekstazi.agent.EkstaziAgent",
                "Can-Redefine-Classes": "true",
                "Can-Retransform-Classes": "true"
        )
    }
}

// This is handy to copy dependencies into a folder, for use in an IDE etc.
tasks.register('copyToLib', Copy) {
    into "lib"
    from configurations.runtimeClasspath
}

javadoc {
    source = sourceSets.main.allJava
    classpath = configurations.compileClasspath
}

shadowJar {
    dependencies {
        exclude(dependency("org.junit.platform:.*"))
        exclude(dependency("org.junit.jupiter:.*"))
        exclude(dependency("org.junit.vintage:.*"))
        exclude(dependency("junit:junit"))
    }

    // --- JUnit 5 ---
    from(project.configurations.junit5Launcher) {
        into("embedded-libs/junit5")
        rename { "launcher.jar" }
    }
    from(project.configurations.junit5PlatformEngine) {
        into("embedded-libs/junit5")
        rename { "platform-engine.jar" }
    }
    from(project.configurations.junit5JupiterEngine) {
        into("embedded-libs/junit5")
        rename { "jupiter-engine.jar" }
    }
    from(project.configurations.junit5PlatformCommons) {
        into("embedded-libs/junit5")
        rename { "platform-commons.jar" }
    }
    from(project.configurations.junit5JupiterApi) {
        into("embedded-libs/junit5")
        rename { "jupiter-api.jar" }
    }
    from(project.configurations.junit5OpenTest4j) {
        into("embedded-libs/junit5")
        rename { "opentest4j.jar" }
    }
    from(project.configurations.junit5ApiGuardian) {
        into("embedded-libs/junit5")
        rename { "apiguardian.jar" }
    }

    // --- JUnit 6 ---
    from(project.configurations.junit6Launcher) {
        into("embedded-libs/junit6")
        rename { "launcher.jar" }
    }
    from(project.configurations.junit6PlatformEngine) {
        into("embedded-libs/junit6")
        rename { "platform-engine.jar" }
    }
    from(project.configurations.junit6JupiterEngine) {
        into("embedded-libs/junit6")
        rename { "jupiter-engine.jar" }
    }
    from(project.configurations.junit6PlatformCommons) {
        into("embedded-libs/junit6")
        rename { "platform-commons.jar" }
    }
    from(project.configurations.junit6JupiterApi) {
        into("embedded-libs/junit6")
        rename { "jupiter-api.jar" }
    }
    from(project.configurations.junit6OpenTest4j) {
        into("embedded-libs/junit6")
        rename { "opentest4j.jar" }
    }
    from(project.configurations.junit6ApiGuardian) {
        into("embedded-libs/junit6")
        rename { "apiguardian.jar" }
    }


    destinationDirectory = buildDir
    archiveBaseName = 'gin'
    archiveVersion = null
    archiveClassifier = null
    mergeServiceFiles()
}

test {
    useJUnitPlatform()  // ✅ run on JUnit 5 Platform
    testLogging {
        events "PASSED", "FAILED", "SKIPPED" //, "STANDARD_ERROR"
        exceptionFormat "full"
        showCauses true
        showExceptions true
        showStackTraces true
    }
    // If you previously used excludeCategory, switch to tags:
    if (project.hasProperty("excludeCategory")) {
        useJUnitPlatform {
            excludeTags project.property("excludeCategory")
        }
    }
}

tasks.test {
    dependsOn tasks.shadowJar

    // hand the jar path to ExternalTestRunner via system property
    systemProperty "gin.jar", "${buildDir}/gin.jar"
}
